<!doctype html>
<!-- Frameless, transparent window: the app rounds its own corners (.app-root),
     so the html/body must stay transparent. -->
<html lang="en" style="background-color: transparent">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sonarune</title>
    <script>
      // Re-apply the persisted accent before first paint (kept in sync with
      // src/lib/theme.ts, which handles changes from the settings UI). The app
      // is AMOLED dark only, so there is no mode to restore here.
      function onAccentFor(hex) {
        var h = String(hex || "").replace("#", "");
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        if (!/^[0-9a-f]{6}$/i.test(h)) return "#000000";
        var n = parseInt(h, 16);
        var lum = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
          .map(function (v) {
            v /= 255;
            return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          })
          .reduce(function (acc, c, i) {
            return acc + [0.2126, 0.7152, 0.0722][i] * c;
          }, 0);
        return (lum + 0.05) / 0.05 >= 1.05 / (lum + 0.05) ? "#000000" : "#ffffff";
      }
      // Up to 0.5.0 every key started with "jellysic." or "jellysic:". Give
      // them the new prefix once, before anything below or in the app reads
      // them; a key already written under the new name wins.
      try {
        var legacyKeys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (/^jellysic[.:]/.test(key)) legacyKeys.push(key);
        }
        legacyKeys.forEach(function (key) {
          var renamed = "sonarune" + key.slice("jellysic".length);
          if (localStorage.getItem(renamed) === null)
            localStorage.setItem(renamed, localStorage.getItem(key));
          localStorage.removeItem(key);
        });
      } catch (e) {
        /* storage unavailable: nothing to carry over */
      }
      try {
        var savedTheme = JSON.parse(localStorage.getItem("sonarune.theme") || "null");
        if (savedTheme) {
          var root = document.documentElement;
          if (savedTheme.accent)
            root.style.setProperty("--color-accent", savedTheme.accent);
          if (savedTheme.accentHover)
            root.style.setProperty("--color-accent-hover", savedTheme.accentHover);
          // Black or white on the accent, whichever contrasts more -- a dark
          // custom accent with black icons hides the play button. Same rule as
          // onAccentFor() in src/lib/theme.ts; keep the two in sync.
          root.style.setProperty(
            "--color-on-accent",
            onAccentFor(savedTheme.accent)
          );
          // Accent from the cover: start with the last cover accent rather
          // than flashing the fixed one until the cover is read.
          if (savedTheme.accentMode !== "fixed") {
            var coverAccent = JSON.parse(
              localStorage.getItem("sonarune.coverAccent.v2") || "null"
            );
            if (coverAccent) {
              root.style.setProperty("--color-accent", coverAccent.accent);
              root.style.setProperty("--color-accent-hover", coverAccent.hover);
              root.style.setProperty("--color-on-accent", coverAccent.onAccent);
            }
          }
        }
      } catch (e) {
        /* corrupt storage: keep defaults */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
