name: CI

# The public quality gate. `quality` runs on Windows, the primary target, and
# mirrors `npm run verify` step for step. `quality-linux` builds the Linux side
# of the crate -- WebKitGTK instead of WebView2, MPRIS instead of SMTC, ALSA
# instead of WASAPI -- and runs clippy and the unit tests there; the frontend
# and rustfmt are the same on both and run once, on Windows.
#
# GitHub's hosted `windows-latest` image already ships Node, rustup, MSVC and
# cmake, so this only pins versions and adds caching.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Nothing in this pipeline writes to the repository or to a registry.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs rather than moving tags: a tag
# can be repointed by whoever controls the action repository. The comment after
# each SHA names the release; change both together when updating
# (`git ls-remote --tags https://github.com/<owner>/<action>`).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
  # Incremental compilation only costs time and disk on a one-shot CI build.
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 went end-of-life in April 2026.
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Type check (svelte-check)
        run: npm run check

      - name: Frontend tests
        run: npm run test

      - name: Frontend production build
        run: npm run build

      # The image ships rustup; take the current stable so a new clippy lint
      # surfaces here rather than in someone's editor.
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup component add rustfmt clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version --verbose

      # No vcvars step here, on purpose. cargo finds the MSVC linker and cmake
      # finds Visual Studio through the registry, not through PATH, so nothing
      # has to be prepared for them. Measured on 21.09.2026 by running this
      # workflow without `ilammy/msvc-dev-cmd` (run 35648922194) and then the
      # release workflow, which has no cache at all and therefore built libopus
      # with cmake from source in the same run (35649841406, 11 minutes). Do not
      # add it back without a measurement saying it is needed: it was the last
      # third-party action in the release path, and it is pinned to node 20,
      # which GitHub no longer runs.

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-tauri

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  quality-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What a Tauri build links against on Linux, plus ALSA (cpal), D-Bus
      # (MPRIS, the Secret Service) and libclang (bindgen in
      # signalsmith-stretch). The same list as release.yml's build-linux.
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev libdbus-1-dev \
            libclang-dev cmake file

      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustc --version --verbose

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-tauri

      # tauri::generate_context! embeds the frontend; clippy and the tests
      # only need the folder to exist.
      - name: Placeholder frontend
        run: mkdir -p build

      - name: clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
