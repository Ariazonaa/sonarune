ShortDescription: Third-party music client for Jellyfin
Description: >-
  Sonarune is a desktop music client for a Jellyfin server. The interface is Tauri 2 and Svelte
  5; the audio path -- decoding, DSP, gapless playback, crossfade, output device -- lives in
  Rust, so there is no Electron and no external mpv binary. It plays your library with a queue,
  playlists, smart views, lyrics, an equaliser, a visualizer, a mini player and media-key and
  taskbar integration, and it keeps itself up to date.
